name: Track Battle.net Shop

on:
  # Started by the tracker when the last run is sweep_minutes old (sources.yaml). No cron.
  workflow_dispatch:

# A queued run replaced by a newer dispatch loses nothing, as every run does the same work.
concurrency:
  group: shop
  cancel-in-progress: false

jobs:
  shop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout main branch (code) into ./code
        uses: actions/checkout@v7
        with:
          ref: main
          path: code

      - name: Checkout shop branch into ./shop
        uses: actions/checkout@v7
        with:
          ref: shop
          path: shop

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: code/package-lock.json

      - run: npm ci --omit=dev --no-audit --no-fund
        working-directory: code

      - name: Configure git identity
        working-directory: shop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch the shop
        env:
          SHOP_DIR: shop
          SHOP_DIFF_FILE: shop-diff.json
        run: node code/src/main.js --shop

      # Once a day; it never fails the run.
      - name: Check for new shop families
        continue-on-error: true
        env:
          SHOP_DIR: shop
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
        run: node code/src/main.js --shop-families

      - name: Commit and push
        env:
          SHOP_DIR: shop
          SHOP_DIFF_FILE: shop-diff.json
        run: node code/src/main.js --shop-commit

      # For BlizzFeedBot, like the tracker's. Also saves the list of recent posts on the shop branch.
      - name: Write outbox
        env:
          SHOP_DIR: shop
          SHOP_DIFF_FILE: shop-diff.json
          GITHUB_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node code/src/main.js --shop-outbox

      - name: Upload outbox
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outbox
          path: outbox.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Discord
        if: always()
        env:
          SHOP_DIFF_FILE: shop-diff.json
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
        run: node code/src/main.js --shop-notify

      # Like the tracker's: tells healthchecks.io the run got through, so a check alerts when shop runs stop
      # finishing. Best effort: it never fails the run.
      - name: Heartbeat
        continue-on-error: true
        env:
          HEARTBEAT_URL: ${{ secrets.SHOP_HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS -m 10 --retry 2 -o /dev/null "$HEARTBEAT_URL" || echo "Heartbeat ping failed."
          else
            echo "SHOP_HEARTBEAT_URL isn't set, no heartbeat."
          fi

      # Kept in case the commit landed but a later step failed.
      - name: Keep diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: shop-diff-${{ github.run_id }}
          path: shop-diff.json
          if-no-files-found: ignore
          retention-days: 7
