name: Test outbox (temporary)

# Builds a fake outbox from a stored article and uploads it as the "outbox" artifact, to try the bot's
# download without waiting for a real post. Every entry is addressed to the given channel.
# This file will be deleted once the bot has been tested.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel ID the test entries are addressed to
        required: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout source branch (code) into ./code
        uses: actions/checkout@v7
        with:
          ref: source
          path: code

      - name: Checkout data branch into ./data
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: code/requirements.txt

      - run: pip install --disable-pip-version-check -r code/requirements.txt

      - name: Build a test outbox
        env:
          CHANNEL: ${{ inputs.channel }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import json, os, sys
          CODE, DATA = "code", "data"
          sys.path.insert(0, CODE)
          from modules.core.config import load_sources
          from modules.notifiers import outbox

          sources = {s.id: s for s in load_sources(f"{CODE}/sources.yaml")}
          with open(f"{DATA}/diablo-4-news/state.json", encoding="utf-8") as f:
              items = json.load(f)
          diff = {"sources": {"diablo-4-news": {"added": [items[0]], "updated": [items[1]], "commit": None}}}
          entries = outbox.build_tracker_entries(diff, sources, "https://github.com/BlizzFeed/BlizzFeed", outbox.now_iso())
          for entry in entries:
              entry["channel"] = os.environ["CHANNEL"]
          outbox.write("outbox.json", "tracker", entries, os.environ["ACTIONS_RUN_URL"])
          EOF

      - name: Upload outbox
        uses: actions/upload-artifact@v7
        with:
          name: outbox
          path: outbox.json
          retention-days: 1
