name: Archive Blizzard Articles

on:
  # Started by the tracker when it saves a change, and hourly by trigger/dispatch.py. No cron.
  workflow_dispatch:

# Its own group: sharing the tracker's would let each cancel the other's queued run.
# A queued run replaced by a newer dispatch loses nothing, as every run does the same work.
concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout source branch (code) into ./code
        uses: actions/checkout@v7
        with:
          ref: source
          path: code

      # Read only, never pushed.
      - name: Checkout data branch into ./data
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          persist-credentials: false

      - name: Checkout archive branch into ./archive
        uses: actions/checkout@v7
        with:
          ref: archive
          path: archive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: code/requirements.txt

      - run: pip install --disable-pip-version-check -r code/requirements.txt

      - name: Configure git identity
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch articles
        env:
          DATA_DIR: data
          ARCHIVE_DIR: archive
          ARCHIVE_DIFF_FILE: archive-diff.json
        run: python code/archive.py --fetch

      # Notify only runs if this succeeded, so a post never links an unpushed commit.
      - name: Commit and push
        env:
          ARCHIVE_DIR: archive
          ARCHIVE_DIFF_FILE: archive-diff.json
        run: python code/archive.py --commit

      # For BlizzFeedBot. Before Notify Discord, so a webhook failure can't block it.
      - name: Write outbox
        env:
          ARCHIVE_DIFF_FILE: archive-diff.json
          GITHUB_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python code/archive.py --outbox

      - name: Upload outbox
        uses: actions/upload-artifact@v7
        with:
          name: outbox
          path: outbox.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Discord
        env:
          ARCHIVE_DIFF_FILE: archive-diff.json
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD_WEBHOOK_WOW: ${{ secrets.DISCORD_WEBHOOK_WOW }}
          DISCORD_WEBHOOK_WOW_US: ${{ secrets.DISCORD_WEBHOOK_WOW_US }}
          DISCORD_WEBHOOK_HOTS: ${{ secrets.DISCORD_WEBHOOK_HOTS }}
          DISCORD_WEBHOOK_HEARTHSTONE: ${{ secrets.DISCORD_WEBHOOK_HEARTHSTONE }}
          DISCORD_WEBHOOK_DIABLO5: ${{ secrets.DISCORD_WEBHOOK_DIABLO5 }}
          DISCORD_WEBHOOK_DIABLO4: ${{ secrets.DISCORD_WEBHOOK_DIABLO4 }}
          DISCORD_WEBHOOK_DIABLOIMMORTAL: ${{ secrets.DISCORD_WEBHOOK_DIABLOIMMORTAL }}
          DISCORD_WEBHOOK_DIABLO2: ${{ secrets.DISCORD_WEBHOOK_DIABLO2 }}
          DISCORD_WEBHOOK_DIABLO3: ${{ secrets.DISCORD_WEBHOOK_DIABLO3 }}
          DISCORD_WEBHOOK_DIABLO: ${{ secrets.DISCORD_WEBHOOK_DIABLO }}
          DISCORD_WEBHOOK_OVERWATCH: ${{ secrets.DISCORD_WEBHOOK_OVERWATCH }}
          DISCORD_WEBHOOK_STARCRAFT: ${{ secrets.DISCORD_WEBHOOK_STARCRAFT }}
          DISCORD_WEBHOOK_STARCRAFTREMASTERED: ${{ secrets.DISCORD_WEBHOOK_STARCRAFTREMASTERED }}
          DISCORD_WEBHOOK_STARCRAFT2: ${{ secrets.DISCORD_WEBHOOK_STARCRAFT2 }}
          DISCORD_WEBHOOK_WARCRAFT3: ${{ secrets.DISCORD_WEBHOOK_WARCRAFT3 }}
          DISCORD_WEBHOOK_WARCRAFTRUMBLE: ${{ secrets.DISCORD_WEBHOOK_WARCRAFTRUMBLE }}
          DISCORD_WEBHOOK_BLIZZARD: ${{ secrets.DISCORD_WEBHOOK_BLIZZARD }}
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
        run: python code/archive.py --notify

      # If Discord failed after the commit landed, keep the diff so the posts can be replayed by hand
      # (download it and run archive.py --notify).
      - name: Keep diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: archive-diff-${{ github.run_id }}
          path: archive-diff.json
          if-no-files-found: ignore
          retention-days: 7
