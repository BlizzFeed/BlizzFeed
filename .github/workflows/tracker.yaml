name: Check Blizzard News

on:
  # Sent every minute by an external trigger (dispatch.py).
  # There is no cron here, as Github can't promise exact runs.
  workflow_dispatch:
    inputs:
      deepen:
        description: Store older articles from deeper feed pages instead of a normal run. Announces nothing.
        required: false
        type: boolean
        default: false
      source:
        description: With deepen, the source id (e.g. wow-news).
        required: false
        type: string
      from_page:
        description: With deepen, the first page to read. A first run read pages 0 to 9.
        required: false
        type: string
        default: "10"
      pages:
        description: With deepen, how many pages to read (1 to 20).
        required: false
        type: string
        default: "10"
  push:
    branches: [source]

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write  # to start the archive and shop workflows

    steps:
      - name: Checkout source branch (code) into ./code
        uses: actions/checkout@v7
        with:
          ref: source
          path: code

      - name: Checkout data branch into ./data
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: code/requirements.txt

      - run: pip install --disable-pip-version-check -r code/requirements.txt

      # Start a shop run when the last one is sweep_minutes old. A failed dispatch doesn't fail this run:
      # the next minute tries again.
      - name: Start shop run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          minutes=$(PYTHONPATH=code python -c "from modules.core.config import load_shop_config; print(load_shop_config('code/sources.yaml')['sweep_minutes'])")
          last=$(gh run list --workflow shop.yaml --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -ge $(( minutes * 60 )) ]; then
            gh workflow run shop.yaml --ref source
          fi

      - name: Configure git identity
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scrape
        env:
          OUTPUT_DIR: data
          DIFF_FILE: diff.json
          DEEPEN: ${{ inputs.deepen }}
          DEEPEN_SOURCE: ${{ inputs.source }}
          DEEPEN_FROM_PAGE: ${{ inputs.from_page }}
          DEEPEN_PAGES: ${{ inputs.pages }}
        run: |
          if [ "$DEEPEN" = "true" ]; then
            python code/main.py --deepen --source "$DEEPEN_SOURCE" --from-page "$DEEPEN_FROM_PAGE" --pages "$DEEPEN_PAGES"
          else
            python code/main.py --scrape
          fi

      # Commits per source and pushes. Notify only runs if this succeeded, so
      # an embed never links a commit that was not pushed.
      - name: Commit and push
        env:
          OUTPUT_DIR: data
          DIFF_FILE: diff.json
        run: python code/main.py --commit

      # For BlizzFeedBot, the only way posts reach Discord. A failure here is a missed post, so it fails the run.
      - name: Write outbox
        env:
          DIFF_FILE: diff.json
          GITHUB_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python code/main.py --outbox

      - name: Upload outbox
        uses: actions/upload-artifact@v7
        with:
          name: outbox
          path: outbox.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Discord
        id: notify
        if: always()
        env:
          OUTPUT_DIR: data
          DIFF_FILE: diff.json
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
        run: python code/main.py --notify

      # Start an archive run when anything was added, updated or quiet (a date bump is often a text edit).
      # It gets the log post's id, so its summary is added to that post.
      # A failed dispatch doesn't fail this run: the hourly archive run catches up.
      - name: Start archive run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOG_MESSAGE: ${{ steps.notify.outputs.log_message }}
        run: |
          if python -c "import json, sys; d = json.load(open('diff.json')); sys.exit(not any(e['added'] or e['updated'] or e['quiet'] for e in d['sources'].values()))"; then
            gh workflow run archive.yaml --ref source ${LOG_MESSAGE:+-f log_message=$LOG_MESSAGE}
          else
            echo "No changes, no archive run needed."
          fi

      # Tells healthchecks.io a run got all the way through, so an outside check alerts when runs stop
      # finishing (Actions down, or every run failing). Best effort: it never fails the run.
      - name: Heartbeat
        continue-on-error: true
        env:
          HEARTBEAT_URL: ${{ secrets.TRACKER_HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS -m 10 --retry 2 -o /dev/null "$HEARTBEAT_URL" || echo "Heartbeat ping failed."
          else
            echo "TRACKER_HEARTBEAT_URL isn't set, no heartbeat."
          fi

      # If Discord failed after the commit landed, keep the diff so the alert can be replayed by hand
      # (download it and run main.py --notify). Nothing replays it automatically.
      - name: Keep diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diff-${{ github.run_id }}
          path: diff.json
          if-no-files-found: ignore
          retention-days: 7
