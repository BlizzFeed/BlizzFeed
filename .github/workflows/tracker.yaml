name: Check Blizzard News

on:
  # Sent every minute by an external trigger (trigger/dispatch.py).
  # There is no cron here, as Github can't promise exact runs.
  workflow_dispatch:
  push:
    branches: [source]

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write  # to start the archive workflow

    steps:
      - name: Checkout source branch (code) into ./code
        uses: actions/checkout@v7
        with:
          ref: source
          path: code

      - name: Checkout data branch into ./data
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: code/requirements.txt

      - run: pip install --disable-pip-version-check -r code/requirements.txt

      - name: Configure git identity
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scrape
        env:
          OUTPUT_DIR: data
          DIFF_FILE: diff.json
        run: python code/main.py --scrape

      # Commits per source and pushes. Notify only runs if this succeeded, so
      # an embed never links a commit that was not pushed.
      - name: Commit and push
        env:
          OUTPUT_DIR: data
          DIFF_FILE: diff.json
        run: python code/main.py --commit

      # For BlizzFeedBot. Before Notify Discord, so a webhook failure can't block it.
      - name: Write outbox
        env:
          DIFF_FILE: diff.json
          GITHUB_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python code/main.py --outbox

      - name: Upload outbox
        uses: actions/upload-artifact@v7
        with:
          name: outbox
          path: outbox.json
          if-no-files-found: ignore
          retention-days: 7

      # Start an archive run when anything was added, updated or quiet (a date bump is often a text edit).
      # A failed dispatch doesn't fail this run: the hourly archive run catches up.
      - name: Start archive run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if python -c "import json, sys; d = json.load(open('diff.json')); sys.exit(not any(e['added'] or e['updated'] or e['quiet'] for e in d['sources'].values()))"; then
            gh workflow run archive.yaml --ref source
          else
            echo "No changes, no archive run needed."
          fi

      - name: Notify Discord
        env:
          OUTPUT_DIR: data
          DIFF_FILE: diff.json
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD_WEBHOOK_WOW: ${{ secrets.DISCORD_WEBHOOK_WOW }}
          DISCORD_WEBHOOK_WOW_US: ${{ secrets.DISCORD_WEBHOOK_WOW_US }}
          DISCORD_WEBHOOK_HOTS: ${{ secrets.DISCORD_WEBHOOK_HOTS }}
          DISCORD_WEBHOOK_HEARTHSTONE: ${{ secrets.DISCORD_WEBHOOK_HEARTHSTONE }}
          DISCORD_WEBHOOK_DIABLO5: ${{ secrets.DISCORD_WEBHOOK_DIABLO5 }}
          DISCORD_WEBHOOK_DIABLO4: ${{ secrets.DISCORD_WEBHOOK_DIABLO4 }}
          DISCORD_WEBHOOK_DIABLOIMMORTAL: ${{ secrets.DISCORD_WEBHOOK_DIABLOIMMORTAL }}
          DISCORD_WEBHOOK_DIABLO2: ${{ secrets.DISCORD_WEBHOOK_DIABLO2 }}
          DISCORD_WEBHOOK_DIABLO3: ${{ secrets.DISCORD_WEBHOOK_DIABLO3 }}
          DISCORD_WEBHOOK_DIABLO: ${{ secrets.DISCORD_WEBHOOK_DIABLO }}
          DISCORD_WEBHOOK_OVERWATCH: ${{ secrets.DISCORD_WEBHOOK_OVERWATCH }}
          DISCORD_WEBHOOK_STARCRAFT: ${{ secrets.DISCORD_WEBHOOK_STARCRAFT }}
          DISCORD_WEBHOOK_STARCRAFTREMASTERED: ${{ secrets.DISCORD_WEBHOOK_STARCRAFTREMASTERED }}
          DISCORD_WEBHOOK_STARCRAFT2: ${{ secrets.DISCORD_WEBHOOK_STARCRAFT2 }}
          DISCORD_WEBHOOK_WARCRAFT3: ${{ secrets.DISCORD_WEBHOOK_WARCRAFT3 }}
          DISCORD_WEBHOOK_WARCRAFTRUMBLE: ${{ secrets.DISCORD_WEBHOOK_WARCRAFTRUMBLE }}
          DISCORD_WEBHOOK_BLIZZARD: ${{ secrets.DISCORD_WEBHOOK_BLIZZARD }}
          DISCORD_WEBHOOK_LOG: ${{ secrets.DISCORD_WEBHOOK_LOG }}
        run: python code/main.py --notify

      # If Discord failed after the commit landed, keep the diff so the alert can be replayed by hand
      # (download it and run main.py --notify). Nothing replays it automatically.
      - name: Keep diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diff-${{ github.run_id }}
          path: diff.json
          if-no-files-found: ignore
          retention-days: 7
