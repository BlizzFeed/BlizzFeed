name: Check Blizzard News

on:
  workflow_dispatch:
  # Sent every 5 minutes by an external trigger.
  # There is no cron here, as Github can't promise exact runs.
  repository_dispatch:
    types: [trigger-scraping]
  push:
    branches: [source]

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout source branch (code) into ./code
        uses: actions/checkout@v7
        with:
          ref: source
          path: code

      - name: Checkout data branch into ./data
        uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: code/requirements.txt

      - run: pip install -r code/requirements.txt

      - name: Configure git identity
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scrape
        env:
          OUTPUT_DIR: data
          DIFF_FILE: diff.json
        run: python code/main.py --scrape

      # Commits per source and pushes. Notify only runs if this succeeded, so
      # an embed never links a commit that was not pushed.
      - name: Commit and push
        env:
          OUTPUT_DIR: data
          DIFF_FILE: diff.json
        run: python code/main.py --commit

      - name: Notify Discord
        env:
          OUTPUT_DIR: data
          DIFF_FILE: diff.json
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD_WEBHOOK_WOW: ${{ secrets.DISCORD_WEBHOOK_WOW }}
          DISCORD_WEBHOOK_HOTS: ${{ secrets.DISCORD_WEBHOOK_HOTS }}
          DISCORD_WEBHOOK_HEARTHSTONE: ${{ secrets.DISCORD_WEBHOOK_HEARTHSTONE }}
          DISCORD_WEBHOOK_DIABLO4: ${{ secrets.DISCORD_WEBHOOK_DIABLO4 }}
          DISCORD_WEBHOOK_DIABLOIMMORTAL: ${{ secrets.DISCORD_WEBHOOK_DIABLOIMMORTAL }}
          DISCORD_WEBHOOK_DIABLO2: ${{ secrets.DISCORD_WEBHOOK_DIABLO2 }}
          DISCORD_WEBHOOK_DIABLO3: ${{ secrets.DISCORD_WEBHOOK_DIABLO3 }}
          DISCORD_WEBHOOK_DIABLO: ${{ secrets.DISCORD_WEBHOOK_DIABLO }}
          DISCORD_WEBHOOK_OVERWATCH: ${{ secrets.DISCORD_WEBHOOK_OVERWATCH }}
          DISCORD_WEBHOOK_STARCRAFT2: ${{ secrets.DISCORD_WEBHOOK_STARCRAFT2 }}
          DISCORD_WEBHOOK_WARCRAFT3: ${{ secrets.DISCORD_WEBHOOK_WARCRAFT3 }}
          DISCORD_WEBHOOK_BLIZZARD: ${{ secrets.DISCORD_WEBHOOK_BLIZZARD }}
        run: python code/main.py --notify

      # If Discord failed after the commit landed, keep the diff so the alert can be replayed.
      - name: Keep diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diff-${{ github.run_id }}
          path: diff.json
          if-no-files-found: ignore
