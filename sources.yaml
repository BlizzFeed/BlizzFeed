# Pages to watch. Adding a source needs no code change.
#
# Source keys
#   id            Unique. Also the folder name on the data branch.
#   name          Shown at the top of each Discord message.
#   type          html (CSS selectors) or json (dotted paths into an API response).
#   url           The page to poll.
#   webhook       Label for the Discord webhook: "WOW" reads the secret DISCORD_WEBHOOK_WOW.
#                 Can be a list to post to several channels, e.g. [DIABLO4, DIABLO]. The first is
#                 the source's own channel and the only one that gets failure alerts.
#                 A new label also needs its secret listed in the workflow's Notify step.
#   channels      Label(s) for BlizzFeedBot, looked up in the channels: block below.
#   username      Optional. Name shown as the poster of this source's messages (the game's title).
#   avatar        Optional. Logo (SVG or image URL) shown as the webhook's avatar on this source's messages.
#   url_prefix    Optional (html). Prepended to article links that start with "/".
#   item_selector (html) CSS selector matching each article.
#   items_path    (json) Dotted path to the list of articles.
#   offset_param  (json) Query parameter for paging, e.g. offset. Leave out for a single request.
#   page_size     (json) Articles per page, used to step the offset.
#   pages         (json) Most pages read on a normal run. Paging stops early once a page
#                 ends on an article we already have, so a normal run is usually one request.
#   baseline_pages (json) Pages read on a source's first run, to record older articles too.
#   where         (json) Only keep articles where each dotted path equals the given value, or one
#                 of the values when given a list. The news API tags a post with several games,
#                 so this keeps each post to the one game it's filed under.
#   url_template  Optional (json). Article link built from dotted paths in {braces}, e.g. the game's own
#                 news site instead of news.blizzard.com. Falls back to fields.url if a path is empty.
#   shop_path     Optional (json). Path to a list of call-to-action objects; the first "shopLinks" entry
#                 with a url becomes a shop button on the message.
#   allow_empty   Optional. An empty feed isn't treated as a failure (for games with no posts yet).
#   fields        How to read id, url, title, summary, date and image from one article.
#
# Field specs
#   html: a CSS selector (uses the element's text), or a mapping with any of:
#           selector, attr, json_key (read a key from a JSON attribute),
#           regex (the value becomes the first capture group)
#   json: a dotted path, e.g. properties.title

defaults:
  failures_before_alert: 12  # consecutive failed runs (about a minute each) before a "source failing" message

# Discord role to ping in a channel, by webhook label (a role only works in its own server).
# A channel pings its role once per run, on its first new message. No entry means no ping.
ping_roles:
#  WOW: "1554600863081959464"
#  DIABLO: "123456789"       # one @diablo for the shared Diablo channel

# Discord channel IDs for BlizzFeedBot, by label and tier: all (new + updated), new, updated.
# An empty ID is skipped with a warning.
channels:
  BLIZZARD:             {all: "", new: "", updated: ""}
  DIABLO:               {all: "", new: "", updated: ""}
  DIABLO2:              {all: "", new: "", updated: ""}
  DIABLO3:              {all: "", new: "", updated: ""}
  DIABLO4:              {all: "", new: "", updated: ""}
  DIABLO5:              {all: "", new: "", updated: ""}
  DIABLOIMMORTAL:       {all: "", new: "", updated: ""}
  HEARTHSTONE:          {all: "", new: "", updated: ""}
  HOTS:                 {all: "", new: "", updated: ""}
  OVERWATCH:            {all: "", new: "", updated: ""}
  STARCRAFT:            {all: "", new: "", updated: ""}
  STARCRAFT2:           {all: "", new: "", updated: ""}
  STARCRAFTREMASTERED:  {all: "", new: "", updated: ""}
  WARCRAFT3:            {all: "", new: "", updated: ""}
  WARCRAFTRUMBLE:       {all: "", new: "", updated: ""}
  WOW:                  {all: "", new: "", updated: ""}
  WOW_US:               {all: "", new: "", updated: ""}

# Article archive (archive.py): saves each article's card and full text as Markdown on the archive branch.
archive:
  window_days: 7          # re-check articles updated this recently, to catch edits that don't bump the date
  sweep_minutes: 55       # that re-check runs at most this often
  max_fetches: 60         # article page fetches per run; the rest carry over to the next run
  fetch_delay_seconds: 2
  body_selector: "article.Content section.blog"
  failures_before_alert: 3   # consecutive failed archive runs per source before a log alert
  baseline_days: 30       # a source's first archive run saves articles updated this recently (no posts)
  # Role to ping on "Article text edited" posts, by webhook label. Off for now: hotfix posts
  # are edited several times a day, so it would be noisy.
  # ping_roles:
  #   WOW: "1554600863081959464"
  #   DIABLO: "123456789"

# Shared settings for news.blizzard.com, reused below with "<<: *blizzard-news-api".
# The feed is sorted by last update, newest first, 15 articles per page.
templates:
  blizzard-news-api: &blizzard-news-api
    type: json
    items_path: contentItems
    offset_param: offset
    page_size: 15
    pages: 2
    baseline_pages: 10
    shop_path: properties.cardActions
    fields:
      id: properties.newsId
      url: properties.newsUrl
      title: properties.title
      summary: properties.summary
      date: properties.lastUpdated
      image: properties.staticAsset.imageUrl

