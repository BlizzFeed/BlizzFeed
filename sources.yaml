# Pages to watch. Adding a source needs no code change.
#
# Source keys
#   id            Unique. Also the folder name on the data branch.
#   name          Shown at the top of each Discord message.
#   type          html (CSS selectors) or json (dotted paths into an API response).
#   url           The page to poll.
#   webhook       Label for the Discord webhook: "WOW" reads the secret DISCORD_WEBHOOK_WOW.
#                 Can be a list to post to several channels, e.g. [DIABLO4, DIABLO]. The first is
#                 the source's own channel and the only one that gets failure alerts.
#                 A new label also needs its secret listed in the workflow's Notify step.
#   url_prefix    Optional (html). Prepended to article links that start with "/".
#   item_selector (html) CSS selector matching each article.
#   items_path    (json) Dotted path to the list of articles.
#   offset_param  (json) Query parameter for paging, e.g. offset. Leave out for a single request.
#   page_size     (json) Articles per page, used to step the offset.
#   pages         (json) Most pages read on a normal run. Paging stops early once a page
#                 ends on an article we already have, so a normal run is usually one request.
#   baseline_pages (json) Pages read on a source's first run, to record older articles too.
#   where         (json) Only keep articles where each dotted path equals the given value.
#                 Needed on the news API's small-game feeds, which pad with other games' posts.
#   fields        How to read id, url, title, summary, date and image from one article.
#
# Field specs
#   html: a CSS selector (uses the element's text), or a mapping with any of:
#           selector, attr, json_key (read a key from a JSON attribute),
#           regex (the value becomes the first capture group)
#   json: a dotted path, e.g. properties.title

defaults:
  failures_before_alert: 3   # consecutive failed runs before a "source failing" message

# Discord role to ping in a channel, by webhook label (a role only works in its own server).
# A channel pings its role once per run, on its first new message. No entry means no ping.
ping_roles: {}
#  WOW: "1554600863081959464"
#  DIABLO: "123456789"       # one @diablo for the shared Diablo channel

# Shared settings for news.blizzard.com, reused below with "<<: *blizzard-news-api".
# The feed is sorted by last update, newest first, 15 articles per page.
templates:
  blizzard-news-api: &blizzard-news-api
    type: json
    items_path: contentItems
    offset_param: offset
    page_size: 15
    pages: 2
    baseline_pages: 10
    fields:
      id: properties.newsId
      url: properties.newsUrl
      title: properties.title
      summary: properties.summary
      date: properties.lastUpdated
      image: properties.staticAsset.imageUrl

sources:
  - <<: *blizzard-news-api
    id: wow-news
    name: World of Warcraft News
    url: https://news.blizzard.com/en-gb/api/feed/world-of-warcraft
    webhook: WOW

  - <<: *blizzard-news-api
    id: hots-news
    name: Heroes of the Storm News
    url: https://news.blizzard.com/en-gb/api/feed/heroes-of-the-storm
    webhook: HOTS

  - <<: *blizzard-news-api
    id: hearthstone-news
    name: Hearthstone News
    url: https://news.blizzard.com/en-gb/api/feed/hearthstone
    webhook: HEARTHSTONE

  - <<: *blizzard-news-api
    id: diablo-4-news
    name: Diablo IV News
    url: https://news.blizzard.com/en-gb/api/feed/diablo-4
    webhook: [DIABLO4, DIABLO]
    where: {properties.cxpProduct.segment: diablo-4}

  - <<: *blizzard-news-api
    id: diablo-immortal-news
    name: Diablo Immortal News
    url: https://news.blizzard.com/en-gb/api/feed/diablo-immortal
    webhook: [DIABLOIMMORTAL, DIABLO]
    where: {properties.cxpProduct.segment: diablo-immortal}

  - <<: *blizzard-news-api
    id: diablo-2-resurrected-news
    name: Diablo II Resurrected News
    url: https://news.blizzard.com/en-gb/api/feed/diablo-2-resurrected
    webhook: [DIABLO2, DIABLO]
    where: {properties.cxpProduct.segment: diablo-2-resurrected}

  - <<: *blizzard-news-api
    id: diablo-3-news
    name: Diablo III News
    url: https://news.blizzard.com/en-gb/api/feed/diablo-3
    webhook: [DIABLO3, DIABLO]
    where: {properties.cxpProduct.segment: diablo-3}

  - <<: *blizzard-news-api
    id: overwatch-news
    name: Overwatch News
    url: https://news.blizzard.com/en-gb/api/feed/overwatch
    webhook: OVERWATCH
    where: {properties.cxpProduct.segment: overwatch}

  - <<: *blizzard-news-api
    id: starcraft-2-news
    name: StarCraft II News
    url: https://news.blizzard.com/en-gb/api/feed/starcraft-2
    webhook: STARCRAFT2
    where: {properties.cxpProduct.segment: starcraft-2}

  - <<: *blizzard-news-api
    id: warcraft-3-news
    name: Warcraft III News
    url: https://news.blizzard.com/en-gb/api/feed/warcraft-3
    webhook: WARCRAFT3
    where: {properties.cxpProduct.segment: warcraft-3}

  # Company-wide posts (BlizzCon, announcements). The blizzcon feed is all "blizzard" segment, so game posts aren't repeated.
  - <<: *blizzard-news-api
    id: blizzard-news
    name: Blizzard News
    url: https://news.blizzard.com/en-gb/api/feed/blizzcon
    webhook: BLIZZARD
    where: {properties.cxpProduct.segment: blizzard}
