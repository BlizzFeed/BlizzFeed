    webhook: WOW
    channels: WOW
    avatar: https://blz-contentstack-images.akamaized.net/v3/assets/blt286175c11a6b3f4c/blt637a995645d7e161/5d48a388a58fc57f3dafd9f1/world-of-warcraft.svg
    where: {properties.cxpProduct.segment: world-of-warcraft}
    url_template: https://worldofwarcraft.blizzard.com/en-gb/news/{properties.newsId}/{properties.newsSlug}

