# Pages to watch. Adding a source needs no code change.
#
# Source keys
#   id            Unique. Also the folder name on the data branch.
#   name          Shown at the top of each Discord message.
#   type          html (CSS selectors) or json (dotted paths into an API response).
#   url           The page to poll.
#   webhook       Label for the Discord webhook: "WOW" reads the secret DISCORD_WEBHOOK_WOW.
#                 A new label also needs its secret listed in the workflow's Notify step.
#   ping_role     Optional. Role ID to ping, on the first message of a run only.
#   url_prefix    Optional (html). Prepended to article links that start with "/".
#   item_selector (html) CSS selector matching each article.
#   items_path    (json) Dotted path to the list of articles.
#   fields        How to read id, url, title, summary, date and image from one article.
#
# Field specs
#   html: a CSS selector (uses the element's text), or a mapping with any of:
#           selector, attr, json_key (read a key from a JSON attribute),
#           regex (the value becomes the first capture group)
#   json: a dotted path, e.g. properties.title

defaults:
  failures_before_alert: 3   # consecutive failed runs before a "source failing" message

# Shared settings, reused below with "<<: *wow-news-page".
templates:
  wow-news-page: &wow-news-page
    type: html
    webhook: WOW
    item_selector: "article.NewsBlog"
    fields:
      id: { selector: "a.NewsBlog-link", attr: href, regex: "/news/(\\d+)" }
      url: { selector: "a.NewsBlog-link", attr: href }
      title: ".NewsBlog-title"
      summary: ".NewsBlog-desc"
      # The visible date is relative ("2 hours ago") and would cause a change
      # on every run, so read the fixed ISO date from the data-props JSON.
      date: { selector: ".NewsBlog-date", attr: data-props, json_key: iso8601 }
      image: { selector: "img.NewsBlog-image", attr: data-src }

sources:
  - <<: *wow-news-page
    id: wow-news
    name: World of Warcraft News (EU)
    url: https://worldofwarcraft.blizzard.com/en-gb/news
    url_prefix: https://worldofwarcraft.blizzard.com/en-gb   # article links on the page have no locale
    # ping_role: "1554600863081959464"

  - <<: *wow-news-page
    id: wow-news-us
    name: World of Warcraft News (US)
    url: https://worldofwarcraft.blizzard.com/en-us/news
    url_prefix: https://worldofwarcraft.blizzard.com/en-us
    # ping_role: "1554600863081959464"

  - id: hots-news
    name: Heroes of the Storm News
    type: json
    # The /feed/ page is a JS-rendered shell with no article data; this is the API behind it.
    url: https://news.blizzard.com/en-gb/api/feed/heroes-of-the-storm?offset=0
    webhook: HOTS
    items_path: contentItems
    fields:
      id: properties.newsId
      url: properties.newsUrl
      title: properties.title
      summary: properties.summary
      date: properties.lastUpdated
      image: properties.staticAsset.imageUrl

  - id: hearthstone-news
    name: Hearthstone News
    type: json
    url: https://news.blizzard.com/en-gb/api/feed/hearthstone?offset=0
    webhook: HEARTHSTONE
    items_path: contentItems
    fields:
      id: properties.newsId
      url: properties.newsUrl
      title: properties.title
      summary: properties.summary
      date: properties.lastUpdated
      image: properties.staticAsset.imageUrl
